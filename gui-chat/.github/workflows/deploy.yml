name: Build and Deploy Sky Chat

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  APP_NAME: sky-chat

jobs:
  build-and-push:
    name: Build and push application image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
          TCR_REPOSITORY: ${{ secrets.TCR_REPOSITORY }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          missing=''
          for name in ECS_HOST ECS_USER ECS_SSH_PRIVATE_KEY TCR_REGISTRY TCR_NAMESPACE TCR_REPOSITORY TCR_USERNAME TCR_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: pnpm build

      - name: Normalize image name
        id: meta
        env:
          REGISTRY: ${{ secrets.TCR_REGISTRY }}
          NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
          REPOSITORY: ${{ secrets.TCR_REPOSITORY }}
        run: |
          registry="${REGISTRY#http://}"
          registry="${registry#https://}"
          registry="${registry%/}"
          registry="${registry%%/*}"
          namespace="${NAMESPACE##*/}"
          repository="${REPOSITORY##*/}"
          image="$registry/$namespace/$repository"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image }}:latest

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Upload Compose and Nginx configuration
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sky-chat' }}
        run: |
          ssh "$ECS_USER@$ECS_HOST" "mkdir -p '$DEPLOY_PATH/deploy' '$DEPLOY_PATH/generated'"
          scp deploy/docker-compose.production.yml deploy/nginx.conf \
            "$ECS_USER@$ECS_HOST:$DEPLOY_PATH/deploy/"

      - name: Pull image and recreate stack
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sky-chat' }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          ssh "$ECS_USER@$ECS_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' APP_IMAGE='$IMAGE:$IMAGE_TAG' TCR_REGISTRY='$TCR_REGISTRY' TCR_USERNAME='$TCR_USERNAME' TCR_PASSWORD='$TCR_PASSWORD' bash -se" <<'REMOTE'
          set -eu
          command -v docker >/dev/null || { echo 'Docker is not installed on the server'; exit 1; }
          docker compose version >/dev/null || { echo 'Docker Compose plugin is not installed'; exit 1; }
          test -f "$DEPLOY_PATH/.env" || { echo "Missing $DEPLOY_PATH/.env; create it from deploy/PRODUCTION_DEPLOYMENT.md"; exit 1; }

          # The app image runs as UID 1001. This directory persists generated images.
          mkdir -p "$DEPLOY_PATH/generated"
          chown -R 1001:1001 "$DEPLOY_PATH/generated" 2>/dev/null || true

          echo "$TCR_PASSWORD" | docker login "$TCR_REGISTRY" -u "$TCR_USERNAME" --password-stdin
          cd "$DEPLOY_PATH"
          export APP_IMAGE
          docker compose -f deploy/docker-compose.production.yml pull
          docker compose -f deploy/docker-compose.production.yml up -d --remove-orphans
          docker image prune -f
          REMOTE

      - name: Verify health endpoint
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sky-chat' }}
        run: |
          ssh "$ECS_USER@$ECS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          port=$(grep '^APP_HTTP_PORT=' .env | cut -d= -f2- || true)
          port=${port:-80}
          # APP_HTTP_PORT can be '127.0.0.1:3001'; curl needs just the port.
          port=${port##*:}
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "http://127.0.0.1:$port/api/health" >/dev/null; then
              echo 'Health check passed'
              exit 0
            fi
            echo "Waiting for service ($attempt/6)..."
            sleep 10
          done
          docker compose -f deploy/docker-compose.production.yml ps
          docker compose -f deploy/docker-compose.production.yml logs --tail=100 app nginx
          exit 1
          REMOTE
